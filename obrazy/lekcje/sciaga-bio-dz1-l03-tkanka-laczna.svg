<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 500" width="360" height="500" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="80" y="8" width="200" height="36" rx="12" fill="#1D7A5F"/>
  <text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TKANKA ŁĄCZNA</text>
  <path d="M180 44 V52" stroke="#1D7A5F" stroke-width="2.5"/>
  <rect x="14" y="54" width="332" height="44" rx="12" fill="#FDE9C2" stroke="#F5A524" stroke-width="2"/>
  <text x="180" y="72" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1F2A44">luźne komórki + dużo substancji międzykomórkowej</text>
  <text x="180" y="89" text-anchor="middle" font-size="11" fill="#1F2A44">(czasem z włóknami białkowymi)</text>
  <!-- chrzęstna -->
  <rect x="14" y="108" width="332" height="86" rx="14" fill="#E8EEF7" stroke="#4A6FA5" stroke-width="2"/>
  <text x="28" y="132" font-size="15" font-weight="700" fill="#2F4F80">chrzęstna</text>
  <text x="332" y="132" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A44">elastyczna, sprężysta</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="152">komórki w jamkach, dużo włókien białkowych</text><text x="28" y="170">łączy kości (żebra z mostkiem) · chroni w stawach</text><text x="28" y="186">buduje małżowiny uszne</text></g>
  <!-- kostna -->
  <rect x="14" y="204" width="332" height="86" rx="14" fill="#F3EFE6" stroke="#8C7A5B" stroke-width="2"/>
  <text x="28" y="228" font-size="15" font-weight="700" fill="#6B5B3E">kostna</text>
  <text x="332" y="228" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A44">twarda i elastyczna</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="248">komórki w jamkach; sole mineralne (twardość)</text><text x="28" y="266">+ włókna białkowe (elastyczność)</text><text x="28" y="282">buduje szkielet · magazyn wapnia</text></g>
  <!-- tłuszczowa -->
  <rect x="14" y="300" width="332" height="86" rx="14" fill="#FDF3D6" stroke="#B8860B" stroke-width="2"/>
  <text x="28" y="324" font-size="15" font-weight="700" fill="#8a5300">tłuszczowa</text>
  <text x="332" y="324" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A44">pod skórą, wokół narządów</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="344">komórki z kroplą tłuszczu, mało substancji</text><text x="28" y="362">chroni przed urazami i utratą ciepła</text><text x="28" y="378">zapas energii</text></g>
  <!-- krew -->
  <rect x="14" y="396" width="332" height="96" rx="14" fill="#FBE4E4" stroke="#C4552E" stroke-width="2"/>
  <text x="28" y="420" font-size="15" font-weight="700" fill="#C4552E">krew</text>
  <text x="332" y="420" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A44">tkanka płynna</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="440">osocze (ponad połowa) + krwinki i płytki</text><text x="28" y="458">czerwone: tlen · białe: obrona · płytki: krzepnięcie</text><text x="28" y="476">transport · obrona · stała temperatura ciała</text></g>
</svg>
