<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 470" width="360" height="470" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <rect x="80" y="8" width="200" height="36" rx="12" fill="#1D7A5F"/>
  <text x="180" y="32" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">TKANKI ZWIERZĘCE</text>
  <path d="M180 44 V56" stroke="#1D7A5F" stroke-width="2.5"/>
  <!-- nabłonkowa -->
  <rect x="14" y="58" width="332" height="92" rx="14" fill="#FBE4E4" stroke="#C4552E" stroke-width="2"/>
  <text x="28" y="82" font-size="15" font-weight="700" fill="#C4552E">nabłonkowa</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="102">ciasne komórki, 1 lub wiele warstw</text><text x="28" y="120" font-weight="700">chroni · wchłania · wydziela</text><text x="28" y="138">kształt: płaski · sześcienny · walcowaty</text></g>
  <!-- mięśniowa -->
  <rect x="14" y="160" width="332" height="108" rx="14" fill="#FBEBDD" stroke="#B45309" stroke-width="2"/>
  <text x="28" y="184" font-size="15" font-weight="700" fill="#B45309">mięśniowa</text>
  <text x="332" y="184" text-anchor="end" font-size="12" font-weight="700" fill="#1F2A44">kurczy się i rozkurcza → ruch</text>
  <g font-size="12" fill="#1F2A44">
    <text x="28" y="206"><tspan font-weight="700">gładka</tspan> — narządy wewn.; wolno; niezależna od woli</text>
    <text x="28" y="226"><tspan font-weight="700">prążkowana serca</tspan> — serce; szybko; niezależna od woli</text>
    <text x="28" y="246"><tspan font-weight="700">prążkowana szkieletowa</tspan> — kończyny; szybko; zależna</text>
    <text x="28" y="260" font-size="11" fill="#7A716A">od woli — jedyna, która słucha twoich decyzji</text>
  </g>
  <!-- nerwowa -->
  <rect x="14" y="278" width="332" height="80" rx="14" fill="#FDF3D6" stroke="#B8860B" stroke-width="2"/>
  <text x="28" y="302" font-size="15" font-weight="700" fill="#8a5300">nerwowa</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="322">neurony (impuls nerwowy) + komórki gleju (podpora)</text><text x="28" y="342" font-weight="700">odbiera · analizuje · steruje organizmem</text></g>
  <!-- łączna -->
  <rect x="14" y="368" width="332" height="92" rx="14" fill="#E6F2ED" stroke="#1D7A5F" stroke-width="2"/>
  <text x="28" y="392" font-size="15" font-weight="700" fill="#1D7A5F">łączna</text>
  <text x="332" y="392" text-anchor="end" font-size="11" fill="#7A716A">(następna lekcja)</text>
  <g font-size="12" fill="#1F2A44"><text x="28" y="412">luźne komórki + substancja międzykomórkowa</text><text x="28" y="432">chrzęstna · kostna · tłuszczowa · krew</text><text x="28" y="450" font-weight="700">łączy inne tkanki, np. buduje kości</text></g>
</svg>
