<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 481" width="360" height="481" role="img" aria-label="Znaczenie pierścienic w przyrodzie i dla człowieka" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="5" y="5" width="355" height="476" rx="18" fill="#1D7A5F" stroke="#1F1B17" stroke-width="2"/><rect x="0" y="0" width="355" height="476" rx="18" fill="#FFFDF8" stroke="#1F1B17" stroke-width="2"/><text x="22" y="34" font-size="13" font-weight="700" fill="#1D7A5F" text-anchor="start" letter-spacing=".05em">PO CO SĄ PIERŚCIENICE</text><text x="22" y="62" font-size="11" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">W PRZYRODZIE</text><circle cx="31" cy="84" r="9" fill="#BFD9CC" stroke="#1F1B17" stroke-width="1.3"/><text x="31" y="88" font-size="11" font-weight="700" fill="#1F1B17" text-anchor="middle">1</text><text x="48" y="88" font-size="14.5" font-weight="700" fill="#1F1B17" text-anchor="start">pokarm innych zwierząt</text><text x="48" y="107" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">lądowe: krety, ryjówki, szpaki, kosy</text><text x="48" y="124" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">wodne: ryby</text><circle cx="31" cy="148" r="9" fill="#BFD9CC" stroke="#1F1B17" stroke-width="1.3"/><text x="31" y="152" font-size="11" font-weight="700" fill="#1F1B17" text-anchor="middle">2</text><text x="48" y="152" font-size="14.5" font-weight="700" fill="#1F1B17" text-anchor="start">destruenci w glebie</text><text x="48" y="171" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">rozkładają szczątki → powstaje próchnica</text><text x="48" y="188" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">kopią korytarze → spulchniają glebę</text><circle cx="31" cy="212" r="9" fill="#BFD9CC" stroke="#1F1B17" stroke-width="1.3"/><text x="31" y="216" font-size="11" font-weight="700" fill="#1F1B17" text-anchor="middle">3</text><text x="48" y="216" font-size="14.5" font-weight="700" fill="#1F1B17" text-anchor="start">sprzątacze dna</text><text x="48" y="235" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">jedzą szczątki na dnie zbiorników</text><text x="48" y="252" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">→ pomagają oczyszczać wodę</text><line x1="22" y1="264" x2="333" y2="264" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/><text x="22" y="288" font-size="11" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">DLA CZŁOWIEKA</text><circle cx="31" cy="312" r="9" fill="#1D7A5F"/><text x="31" y="317" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">+</text><text x="48" y="316" font-size="14.5" font-weight="700" fill="#1F1B17" text-anchor="start">rureczniki</text><text x="48" y="335" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">hodowane jako pokarm dla ryb akwariowych</text><circle cx="31" cy="360" r="9" fill="#1D7A5F"/><text x="31" y="365" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">+</text><text x="48" y="364" font-size="14.5" font-weight="700" fill="#1F1B17" text-anchor="start">ślina pijawek</text><text x="48" y="383" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">substancje przeciw krzepnięciu krwi</text><text x="48" y="400" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">używane w leczeniu chorób układu krążenia</text><circle cx="31" cy="425" r="9" fill="#C4552E"/><text x="31" y="430" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">−</text><text x="48" y="429" font-size="14.5" font-weight="700" fill="#1F1B17" text-anchor="start">pijawki na rybach</text><text x="48" y="448" font-size="11.5" font-weight="400" fill="#7A716A" text-anchor="start">duże straty w hodowlach ryb</text></svg>
