<text x="262" y="154" font-size="15" font-weight="700" fill="#1F1B17" text-anchor="middle" >TASIEMIEC</text>
<line x1="22" y1="172" x2="333" y2="172" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="25" cy="189" r="3.2" fill="#F5A524"/>
<text x="34" y="193" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">TRYB ŻYCIA</text>
<text x="94" y="212" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >żyje sam,</text>
<text x="94" y="228" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >drapieżnik</text>
<text x="262" y="212" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >pasożyt</text>
<text x="262" y="228" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >w jelicie żywiciela</text>
<line x1="22" y1="250" x2="333" y2="250" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="25" cy="267" r="3.2" fill="#F5A524"/>
<text x="34" y="271" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">JAK JE</text>
<text x="94" y="290" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >łapie ofiarę</text>
<text x="94" y="306" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >wysuwaną gardzielą</text>
<text x="262" y="290" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >wchłania pokarm</text>
<text x="262" y="306" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >całym ciałem</text>
<line x1="22" y1="328" x2="333" y2="328" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="25" cy="345" r="3.2" fill="#F5A524"/>
<text x="34" y="349" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">NABŁONEK</text>
<text x="94" y="368" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >z rzęskami do pływania,</text>
<text x="94" y="384" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >śluz chroni ciało</text>
<text x="262" y="368" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >bez rzęsek, chroni</text>
<text x="262" y="384" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >przed strawieniem</text>
<line x1="22" y1="406" x2="333" y2="406" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="25" cy="423" r="3.2" fill="#F5A524"/>
<text x="34" y="427" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">OCZY</text>
<text x="94" y="446" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >ma — szuka ofiar</text>
<text x="262" y="446" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >nie ma — nie musi</text>
<text x="262" y="462" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="middle" >niczego szukać</text>
<line x1="22" y1="484" x2="333" y2="484" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<text x="22" y="510" font-size="16" font-weight="700" fill="#B26A00" text-anchor="start" >wspólne: długie, płaskie ciało</text>
<text x="22" y="530" font-size="12" font-weight="600" fill="#155C48" text-anchor="start" >obaj to płazińce, czyli robaki płaskie</text>
</svg>
