<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 393" width="360" height="393" role="img" aria-label="Skąd się bierze rafa koralowa">
  <style>.t{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}</style>
  <rect x="5" y="5" width="355" height="388" rx="18" fill="#1D7A5F" stroke="#1F1B17" stroke-width="2"/>
  <rect x="0" y="0" width="355" height="388" rx="18" fill="#FFFDF8" stroke="#1F1B17" stroke-width="2"/>
  <text class="t" x="24" y="38" font-size="13" font-weight="700" fill="#1D7A5F" letter-spacing=".05em">SKĄD SIĘ BIERZE RAFA KORALOWA</text>
  <circle cx="27" cy="66" r="3.2" fill="#1D7A5F"/>
  <text class="t" x="36" y="70" font-size="11" font-weight="700" fill="#B26A00" letter-spacing=".07em">KORALOWCE BUDUJĄ SZKIELET</text>
  <text class="t" x="24" y="97" font-size="15" font-weight="700" fill="#1F1B17">twardy szkielet z wapienia</text>
  <path d="M37 107 L37 120" stroke="#1D7A5F" stroke-width="2.2" stroke-linecap="round"/><path d="M32.5 115.5 L37 121 L41.5 115.5" fill="none" stroke="#1D7A5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="27" cy="142" r="3.2" fill="#1D7A5F"/>
  <text class="t" x="36" y="146" font-size="11" font-weight="700" fill="#B26A00" letter-spacing=".07em">KORALOWCE OBUMIERAJĄ</text>
  <text class="t" x="24" y="173" font-size="15" font-weight="700" fill="#1F1B17">wapienne szkielety zostają</text>
  <text class="t" x="24" y="195" font-size="11.5" fill="#7A716A">dochodzą szkielety innych zwierząt morskich</text>
  <path d="M37 204 L37 217" stroke="#1D7A5F" stroke-width="2.2" stroke-linecap="round"/><path d="M32.5 212.5 L37 218 L41.5 212.5" fill="none" stroke="#1D7A5F" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="t" x="24" y="250" font-size="19" font-weight="700" fill="#B26A00">rafa koralowa</text>
  <text class="t" x="24" y="273" font-size="11.5" font-weight="600" fill="#155C48">setki tysięcy gatunków: głównie ryby i koralowce</text>
  <line x1="24" y1="287" x2="331" y2="287" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
  <circle cx="27" cy="309" r="3.2" fill="#1D7A5F"/>
  <text class="t" x="36" y="313" font-size="11" font-weight="700" fill="#B26A00" letter-spacing=".07em">GDZIE JEJ SZUKAĆ</text>
  <text class="t" x="24" y="340" font-size="15" font-weight="700" fill="#1F1B17">ciepłe morze: woda ≥ 20°C</text>
  <text class="t" x="24" y="365" font-size="15" font-weight="700" fill="#1F1B17">przy brzegu, 20–30 m głębokości</text>
