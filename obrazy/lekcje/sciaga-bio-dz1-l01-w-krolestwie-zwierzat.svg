<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 440" width="360" height="440" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs><marker id="s" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1D7A5F"/></marker></defs>
  <rect x="100" y="8" width="160" height="36" rx="12" fill="#1D7A5F"/>
  <text x="180" y="32" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">ZWIERZĘTA</text>
  <path d="M180 44 V60" stroke="#1D7A5F" stroke-width="2.5" marker-end="url(#s)"/>
  <rect x="14" y="62" width="332" height="56" rx="14" fill="#FDE9C2" stroke="#F5A524" stroke-width="2"/>
  <text x="180" y="86" text-anchor="middle" font-size="14" font-weight="700" fill="#1F2A44">Czy ma sztywny szkielet wewnętrzny?</text>
  <text x="180" y="106" text-anchor="middle" font-size="12" fill="#1F2A44">(czaszka + kręgosłup w środku ciała)</text>
  <!-- TAK -->
  <path d="M120 118 V140" stroke="#1D7A5F" stroke-width="2.5" marker-end="url(#s)"/>
  <rect x="130" y="120" width="40" height="20" rx="10" fill="#1D7A5F"/><text x="150" y="134" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">TAK</text>
  <rect x="14" y="146" width="332" height="118" rx="14" fill="#E6F2ED" stroke="#1D7A5F" stroke-width="2"/>
  <text x="30" y="170" font-size="16" font-weight="700" fill="#1D7A5F">KRĘGOWCE</text>
  <text x="330" y="170" text-anchor="end" font-size="11.5" fill="#1F2A44">ok. 5% gatunków · 5 grup</text>
  <g font-size="13" fill="#1F2A44">
    <text x="30" y="196">• ryby</text><text x="130" y="196">• gady</text><text x="230" y="196">• ssaki</text>
    <text x="30" y="218">• płazy</text><text x="130" y="218">• ptaki</text>
  </g>
  <text x="30" y="250" font-size="11.5" font-weight="700" fill="#1D7A5F">kości w środku, mięśnie ciągną za kości</text>
  <!-- NIE -->
  <path d="M120 264 V286" stroke="#1D7A5F" stroke-width="2.5" marker-end="url(#s)"/>
  <rect x="130" y="266" width="40" height="20" rx="10" fill="#B45309"/><text x="150" y="280" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">NIE</text>
  <rect x="14" y="292" width="332" height="140" rx="14" fill="#FBF0E3" stroke="#B45309" stroke-width="2"/>
  <text x="30" y="316" font-size="16" font-weight="700" fill="#B45309">BEZKRĘGOWCE</text>
  <text x="330" y="316" text-anchor="end" font-size="11.5" fill="#1F2A44">ok. 95% gatunków · 6 grup</text>
  <g font-size="13" fill="#1F2A44">
    <text x="30" y="342">• parzydełkowce</text><text x="190" y="342">• pierścienice</text>
    <text x="30" y="364">• płazińce</text><text x="190" y="364">• stawonogi</text>
    <text x="30" y="386">• nicienie</text><text x="190" y="386">• mięczaki</text>
  </g>
  <text x="30" y="418" font-size="11.5" font-weight="700" fill="#B45309">ciało nagie albo pancerz / muszla na zewnątrz</text>
</svg>
