<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 525" width="360" height="525" role="img" aria-label="Obieg tasiemca uzbrojonego" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif">
<defs><marker id="g" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#F5A524"/></marker><marker id="z" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1D7A5F"/></marker></defs>
<rect x="5" y="5" width="355" height="520" rx="18" fill="#F5A524" stroke="#1F1B17" stroke-width="2"/>
<rect x="0" y="0" width="355" height="520" rx="18" fill="#FFFDF8" stroke="#1F1B17" stroke-width="2"/>
<text x="22" y="36" font-size="13" font-weight="700" fill="#1D7A5F" text-anchor="start" letter-spacing=".05em">OBIEG TASIEMCA UZBROJONEGO</text>
<rect x="22" y="54" width="278" height="76" rx="12" fill="#FBE9E9" stroke="#E6DDCE" stroke-width="1.4"/>
<g transform="translate(30 72)"><ellipse cx="30" cy="22" rx="28" ry="15" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1.3"/><circle cx="58" cy="17" r="10" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1.3"/><ellipse cx="67" cy="19" rx="4" ry="3.5" fill="#E9A3A3" stroke="#1F1B17" stroke-width="1"/><path d="M52 8 L56 2 L60 8" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1"/><circle cx="60" cy="14" r="1.3" fill="#1F1B17"/><rect x="10" y="33" width="5" height="9" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1"/><rect x="20" y="33" width="5" height="9" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1"/><rect x="38" y="33" width="5" height="9" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1"/><rect x="46" y="33" width="5" height="9" fill="#F4C6C6" stroke="#1F1B17" stroke-width="1"/><path d="M2 20 C -4 14, 2 10, 4 16" fill="none" stroke="#1F1B17" stroke-width="1.2"/><circle cx="22" cy="20" r="2.3" fill="#4A8CC4"/><circle cx="32" cy="26" r="2.3" fill="#4A8CC4"/><circle cx="40" cy="17" r="2.3" fill="#4A8CC4"/></g>
<text x="112" y="76" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">ŻYWICIEL POŚREDNI</text>
<text x="112" y="94" font-size="12" font-weight="600" fill="#1F1B17" text-anchor="start" >świnia</text>
<text x="112" y="110" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >w mięśniach rosną wągry,</text>
<text x="112" y="126" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >czyli larwy tasiemca</text>
<line x1="66" y1="132" x2="66" y2="186" stroke="#F5A524" stroke-width="2.4" marker-end="url(#g)"/>
<circle cx="94" cy="148" r="10" fill="#F5A524"/>
<text x="94" y="152.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >1</text>
<text x="112" y="152" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >człowiek je surowe lub</text>
<text x="112" y="168" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >niedogotowane mięso z wągrami</text>
<rect x="22" y="196" width="278" height="76" rx="12" fill="#E4F1EA" stroke="#E6DDCE" stroke-width="1.4"/>
<g transform="translate(42 208)"><circle cx="24" cy="8" r="8" fill="#F1D9C4" stroke="#1F1B17" stroke-width="1.3"/><path d="M8 50 L8 26 C 8 19, 14 17, 24 17 C 34 17, 40 19, 40 26 L40 50 Z" fill="#F1D9C4" stroke="#1F1B17" stroke-width="1.3"/><path d="M16 30 C 30 30, 32 34, 18 36 C 6 38, 32 42, 30 44" fill="none" stroke="#4A8CC4" stroke-width="2.4" stroke-linecap="round"/></g>
<text x="112" y="218" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">ŻYWICIEL OSTATECZNY</text>
<text x="112" y="236" font-size="12" font-weight="600" fill="#1F1B17" text-anchor="start" >człowiek</text>
<text x="112" y="252" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >w jelicie cienkim z wągra</text>
<text x="112" y="268" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >rośnie dorosły tasiemiec</text>
<circle cx="100" cy="248" r="8.5" fill="#F5A524"/>
<text x="100" y="252" font-size="11" font-weight="700" fill="#fff" text-anchor="middle" >2</text>
<line x1="66" y1="274" x2="66" y2="328" stroke="#F5A524" stroke-width="2.4" marker-end="url(#g)"/>
<circle cx="94" cy="290" r="10" fill="#F5A524"/>
<text x="94" y="294.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >3</text>
<text x="112" y="294" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >najstarsze człony z jajami</text>
<text x="112" y="310" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >odpadają i wychodzą z kałem</text>
<rect x="22" y="338" width="278" height="60" rx="12" fill="#FFF4DA" stroke="#E6DDCE" stroke-width="1.4"/>
<g transform="translate(44 352)"><rect x="0" y="6" width="22" height="13" rx="2" fill="#D3B070" stroke="#1F1B17" stroke-width="1" transform="rotate(-12 11 12)"/><rect x="20" y="16" width="22" height="13" rx="2" fill="#D3B070" stroke="#1F1B17" stroke-width="1" transform="rotate(10 31 22)"/><circle cx="6" cy="12" r="1.6" fill="#8a5300"/><circle cx="11" cy="11" r="1.6" fill="#8a5300"/><circle cx="16" cy="10" r="1.6" fill="#8a5300"/><circle cx="26" cy="21" r="1.6" fill="#8a5300"/><circle cx="31" cy="22" r="1.6" fill="#8a5300"/><circle cx="36" cy="23" r="1.6" fill="#8a5300"/></g>
<text x="112" y="360" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">W ŚRODOWISKU</text>
<text x="112" y="378" font-size="12" font-weight="600" fill="#1F1B17" text-anchor="start" >człony tasiemca z jajami</text>
<path d="M300 368 C 334 368, 334 368, 334 340 L334 110 C 334 92, 334 92, 308 92" fill="none" stroke="#F5A524" stroke-width="2.4" marker-end="url(#g)"/>
<circle cx="334" cy="232" r="10" fill="#F5A524"/>
<text x="334" y="236.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<line x1="22" y1="414" x2="333" y2="414" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="32" cy="436" r="10" fill="#F5A524"/>
<text x="32" y="440.5" font-size="12" font-weight="700" fill="#fff" text-anchor="middle" >4</text>
<text x="50" y="432" font-size="12" font-weight="600" fill="#1F1B17" text-anchor="start" >świnia zjada człony z jajami</text>
<text x="50" y="448" font-size="12" font-weight="400" fill="#1F1B17" text-anchor="start" >i w jej mięśniach znowu powstają wągry</text>
<text x="22" y="482" font-size="15" font-weight="700" fill="#B26A00" text-anchor="start" >larwa → pośredni, dorosły → ostateczny</text>
<text x="22" y="502" font-size="12" font-weight="600" fill="#155C48" text-anchor="start" >tasiemiec nieuzbrojony: zamiast świni krowa</text>
</svg>
