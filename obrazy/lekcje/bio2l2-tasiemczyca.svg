<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 408" width="360" height="408" role="img" aria-label="Tasiemczyca" font-family="system-ui,-apple-system,&quot;Segoe UI&quot;,Roboto,sans-serif">
<defs><marker id="g" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#F5A524"/></marker><marker id="z" markerWidth="10" markerHeight="10" refX="5" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0 L10 5 L0 10 Z" fill="#1D7A5F"/></marker></defs>
<rect x="5" y="5" width="355" height="403" rx="18" fill="#E6DDCE" stroke="#1F1B17" stroke-width="2"/>
<rect x="0" y="0" width="355" height="403" rx="18" fill="#FFFDF8" stroke="#1F1B17" stroke-width="2"/>
<text x="22" y="36" font-size="13" font-weight="700" fill="#1D7A5F" text-anchor="start" letter-spacing=".05em">TASIEMCZYCA</text>
<circle cx="25" cy="62" r="3.2" fill="#F5A524"/>
<text x="34" y="66" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">SKĄD SIĘ BIERZE</text>
<text x="22" y="88" font-size="13" font-weight="600" fill="#1F1B17" text-anchor="start" >surowe lub niedogotowane mięso</text>
<text x="22" y="105" font-size="13" font-weight="400" fill="#1F1B17" text-anchor="start" >świni albo krowy, w którym</text>
<text x="22" y="122" font-size="13" font-weight="400" fill="#1F1B17" text-anchor="start" >są wągry (larwy tasiemca)</text>
<line x1="22" y1="145" x2="333" y2="145" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="25" cy="161" r="3.2" fill="#F5A524"/>
<text x="34" y="165" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">JAK SIĘ OBJAWIA</text>
<text x="22" y="187" font-size="13" font-weight="600" fill="#1F1B17" text-anchor="start" >ból brzucha, mdłości, chudnięcie,</text>
<text x="22" y="204" font-size="13" font-weight="400" fill="#1F1B17" text-anchor="start" >ogólne osłabienie,</text>
<text x="22" y="221" font-size="13" font-weight="400" fill="#1F1B17" text-anchor="start" >biegunka albo zaparcie</text>
<line x1="22" y1="244" x2="333" y2="244" stroke="#E6DDCE" stroke-width="1.5" stroke-dasharray="5 5"/>
<circle cx="25" cy="260" r="3.2" fill="#F5A524"/>
<text x="34" y="264" font-size="11.5" font-weight="700" fill="#B26A00" text-anchor="start" letter-spacing=".07em">JAK SIĘ CHRONIĆ</text>
<text x="22" y="286" font-size="13" font-weight="600" fill="#1F1B17" text-anchor="start" >jeść mięso sprawdzone, bez wągrów;</text>
<text x="22" y="303" font-size="13" font-weight="400" fill="#1F1B17" text-anchor="start" >nie jeść surowych ani</text>
<text x="22" y="320" font-size="13" font-weight="400" fill="#1F1B17" text-anchor="start" >niedogotowanych dań mięsnych</text>
<ellipse cx="300" cy="78" rx="30" ry="18" fill="#D98A7A" stroke="#1F1B17" stroke-width="1.3"/>
<path d="M276 72 C 290 66, 306 84, 324 74" fill="none" stroke="#F3E3D6" stroke-width="3"/>
<circle cx="288" cy="82" r="3.4" fill="#FFF8E8" stroke="#8a5300" stroke-width="1"/>
<circle cx="304" cy="70" r="3.4" fill="#FFF8E8" stroke="#8a5300" stroke-width="1"/>
<circle cx="314" cy="86" r="3.4" fill="#FFF8E8" stroke="#8a5300" stroke-width="1"/>
<text x="22" y="365" font-size="17" font-weight="700" fill="#B26A00" text-anchor="start" >mięso dogotuj do końca</text>
<text x="22" y="385" font-size="12" font-weight="600" fill="#155C48" text-anchor="start" >tasiemczyca = tasiemiec w jelicie cienkim</text>
</svg>
