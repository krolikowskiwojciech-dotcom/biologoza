  <text class="t" x="24" y="38" font-size="13" fill="#1D7A5F" font-weight="700" letter-spacing=".05em">DROGA GLISTY LUDZKIEJ</text>
  <text class="t" x="24" y="58" font-size="11.5" fill="#7A716A">jeden żywiciel: cały rozwój w człowieku</text>
