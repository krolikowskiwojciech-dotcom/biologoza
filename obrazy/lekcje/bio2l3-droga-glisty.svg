  <text class="t" x="102" y="394" font-size="13.5" fill="#1F1B17" font-weight="700">samica składa jaja,</text>
  <text class="t" x="102" y="412" font-size="13.5" fill="#1F1B17" font-weight="700">wychodzą z kałem</text>
