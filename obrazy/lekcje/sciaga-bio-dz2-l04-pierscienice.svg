<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 520" width="360" height="520" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"><rect x="80" y="8" width="200" height="36" rx="12" fill="#1D7A5F"/><text x="180" y="32" font-size="15" font-weight="700" fill="#fff" text-anchor="middle">PIERŚCIENICE</text><path d="M180 44 V52" stroke="#1D7A5F" stroke-width="2.5"/><rect x="14" y="54" width="332" height="44" rx="12" fill="#FDE9C2" stroke="#F5A524" stroke-width="2"/><text x="180" y="72" font-size="12.5" font-weight="700" fill="#1F2A44" text-anchor="middle">ciało z segmentów (pierścieni)</text><text x="180" y="89" font-size="11" font-weight="400" fill="#1F2A44" text-anchor="middle">oskórek + śluz na wierzchu · często szczecinki</text><rect x="14" y="108" width="332" height="86" rx="14" fill="#E2EEF3" stroke="#3B7189" stroke-width="2"/><text x="28" y="132" font-size="15" font-weight="700" fill="#3B7189" text-anchor="start">morza i oceany</text><text x="332" y="132" font-size="12" font-weight="700" fill="#1F2A44" text-anchor="end">najwięcej gatunków</text><text x="28" y="152" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">nereida różnokolorowa (też Bałtyk)</text><text x="28" y="169" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">drapieżnik · głowa z oczami, czułkami</text><text x="28" y="186" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">i wąsami · wyrostki ze szczecinkami</text><rect x="14" y="204" width="332" height="86" rx="14" fill="#E9E8E1" stroke="#4B4A3F" stroke-width="2"/><text x="28" y="228" font-size="15" font-weight="700" fill="#4B4A3F" text-anchor="start">wody słodkie</text><text x="332" y="228" font-size="12" font-weight="700" fill="#1F2A44" text-anchor="end">pijawki</text><text x="28" y="248" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">pijawka lekarska: pasożyt zewnętrzny</text><text x="28" y="265" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">2 przyssawki · szczęki tną skórę</text><text x="28" y="282" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">uchyłki: zapas krwi</text><rect x="14" y="300" width="332" height="86" rx="14" fill="#F3E4DA" stroke="#A8503E" stroke-width="2"/><text x="28" y="324" font-size="15" font-weight="700" fill="#A8503E" text-anchor="start">wilgotny ląd</text><text x="332" y="324" font-size="12" font-weight="700" fill="#1F2A44" text-anchor="end">gleba i ściółka</text><text x="28" y="344" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">dżdżownica: szczątki · do 35 cm, ~100 seg.</text><text x="28" y="361" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">przód: kopanie · siodełko: rozmnażanie</text><text x="28" y="378" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">szczecinki: ruch · śluz: ochrona</text><rect x="14" y="396" width="332" height="118" rx="14" fill="#E4F1EA" stroke="#1D7A5F" stroke-width="2"/><text x="28" y="420" font-size="15" font-weight="700" fill="#155C48" text-anchor="start">znaczenie</text><text x="28" y="440" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">przyroda: pokarm kretów, ptaków i ryb</text><text x="28" y="456" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">próchnica · spulchnianie gleby · czysta woda</text><text x="28" y="472" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">człowiek: + rureczniki dla ryb akwariowych</text><text x="28" y="488" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">+ ślina pijawek przeciw krzepnięciu krwi</text><text x="28" y="504" font-size="12" font-weight="400" fill="#1F2A44" text-anchor="start">− pijawki: straty w hodowlach ryb</text></svg>
